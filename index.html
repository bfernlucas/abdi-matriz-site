<title>Esteira de Seleção ABDI 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Lato:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
<style>
/* =========================================================
   Sistema visual: uma grade, uma escala de espaço, uma escala de tipo.
   Espaço 4/8 · tipo em 8 passos · raios 4/8/16/24 · alturas 32/40/44
   ========================================================= */
:root{
  --paper:#ffffff; --surface:#ffffff; --sunk:#f4f6fa; --line:#e1e6ef; --line-2:#c9d1de;
  --ink:#1d2433; --ink-2:#454d5e; --ink-3:#596174;
  --accent:#183eff; --accent-2:#0f2fd6; --accent-ink:#ffffff; --accent-soft:#e9eeff; --accent-line:#b8c6ff;
  --yellow:#ffdd00; --yellow-ink:#5c4b00; --yellow-soft:#fff8cc; --yellow-line:#e6c800;
  --cyan:#00a3e6; --green:#61ce70; --red:#e53935;
  --good:#177333; --good-soft:#e3f5e7; --warn:#8a5a00; --warn-soft:#fff3c4; --bad:#d0302f; --bad-soft:#fde8e8;
  --m1:#2e7d3c; --m2:#c2185b; --m3:#8f5a1f; --m4:#183eff; --m5:#00776a; --m6:#833ca3; --mt:#596174;
  --font:"Poppins","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif; --font-nav:"Lato","Segoe UI",system-ui,sans-serif;
  --container:1280px; --gutter:32px; --measure:70ch;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --r-xs:4px; --r-sm:8px; --r-md:16px; --r-lg:24px; --pill:999px;
  --h-sm:32px; --h-md:40px; --h-lg:44px;
  --pad:24px;
  --stripe:linear-gradient(90deg,#183eff 0 9%,#ffdd00 9% 15%,#61ce70 15% 22%,#e53935 22% 29%,#00b4ff 29% 33%,#183eff 33% 46%,#61ce70 46% 54%,#e53935 54% 59%,#ffdd00 59% 67%,#183eff 67% 77%,#00b4ff 77% 81%,#61ce70 81% 88%,#e53935 88% 93%,#ffdd00 93% 100%);
}
:root{color-scheme:light}
html,body{background:#ffffff}
@media (max-width:760px){ :root{--gutter:16px;--pad:16px} }
@media (pointer:coarse){ :root{--h-md:44px} }

*{box-sizing:border-box} [hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink-2);font:400 15px/24px var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;color:var(--ink);text-wrap:balance}
h1{font:400 36px/44px var(--font);letter-spacing:-.01em}
h2{font:500 22px/30px var(--font)}
h3{font:500 18px/26px var(--font)}
h4{font:500 15px/24px var(--font)}
p{margin:0} a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--ink-3)} .small{font-size:13px;line-height:20px} .tiny{font-size:12px;line-height:16px}
@media (max-width:760px){ h1{font-size:28px;line-height:36px} h2{font-size:19px;line-height:26px} }

/* ---------- cabeçalho global ---------- */
.hd{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px)}
.hd::before{content:"";display:block;height:4px;background:var(--accent)}
.hd::after{content:"";display:block;height:3px;background:var(--stripe)}
.hdi{max-width:calc(var(--container) + 2*var(--gutter));margin:0 auto;padding:var(--s3) var(--gutter);display:flex;align-items:center;gap:var(--s4);min-height:64px}
.logo{all:unset;cursor:pointer;display:flex;align-items:center;gap:var(--s3)}
.logo .wm{display:grid}
.logo b{font:600 16px/20px var(--font);color:var(--accent)} .logo .wm>span{font-size:12px;line-height:16px;color:var(--ink-3)}
.tag{display:inline-block;background:var(--yellow);color:#183eff;font:600 12px/16px var(--font);padding:2px 8px;border-radius:var(--r-xs)}
.nav{margin-left:auto;margin-right:-16px;display:flex;gap:var(--s1);overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{display:inline-flex;align-items:center;height:var(--h-md);padding:0 16px;border-radius:var(--pill);text-decoration:none;color:var(--accent);font:500 15px/20px var(--font-nav);white-space:nowrap}
.nav a:hover{background:var(--accent-soft)}
.nav a[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
@media (max-width:760px){
  .hdi{flex-wrap:wrap;gap:var(--s2)}
  .nav{margin:0 calc(-1*var(--gutter));padding:0 var(--gutter);width:calc(100% + 2*var(--gutter));mask-image:linear-gradient(90deg,#000 85%,transparent);scroll-padding-inline:var(--gutter)}
  .nav a{font-size:14px;padding:0 12px;height:36px}
}
.wrap{max-width:calc(var(--container) + 2*var(--gutter));margin:0 auto;padding:var(--s6) var(--gutter) var(--s8);display:flex;flex-direction:column;gap:var(--s5)}

/* ---------- cabeçalho de página (um só componente) ---------- */
.ph{display:grid;gap:var(--s2);margin-bottom:var(--s2)}
.crumb{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;font-size:13px;line-height:20px;color:var(--ink-3)}
.crumb a{color:var(--accent);text-decoration:none} .crumb a:hover{text-decoration:underline}
.ph-row{display:flex;flex-wrap:wrap;gap:var(--s3) var(--s5);align-items:center;justify-content:space-between}
.ph-row h1{flex:1 1 420px;min-width:0}
.ph-aside{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}
.ph-lead{max-width:var(--measure);color:var(--ink-2)}
.ph-meta{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s6);margin:var(--s2) 0 0}
.ph-meta div{display:flex;gap:var(--s2);align-items:baseline}
.ph-meta dt{font-size:13px;color:var(--ink-3)} .ph-meta dd{margin:0;font:500 14px/20px var(--font);color:var(--ink)}
.ph-count{font-size:13px;color:var(--ink-3)}

/* ---------- controles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:var(--h-md);padding:0 20px;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:var(--pill);cursor:pointer;font:500 14px/20px var(--font);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.quiet{border-color:transparent;background:transparent;padding:0 8px}
.btn.quiet:hover{background:var(--accent-soft)}
.btn.sm{min-height:var(--h-sm);padding:0 14px;font-size:13px}
.btn.danger{border-color:transparent;color:var(--bad);background:transparent;padding:0 12px}
.btn.danger:hover{background:var(--bad-soft)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff;padding:0 20px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;background:var(--sunk);border-radius:var(--pill)}
.seg button{border:0;background:transparent;min-height:calc(var(--h-md) - 6px);padding:0 16px;border-radius:var(--pill);cursor:pointer;font:500 14px/20px var(--font);color:var(--ink-2)}
.seg button:hover{color:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(24,62,255,.12),0 0 0 1px var(--line)}
.seg.sm button{min-height:calc(var(--h-sm) - 6px);padding:0 12px;font-size:13px}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{width:100%;max-width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:0 14px;min-height:var(--h-md);font:400 15px/24px var(--font)}
textarea{padding:8px 14px;min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=range]{accent-color:var(--accent)}
.fld{display:grid;gap:var(--s2);min-width:0}
.fld>label,.lbl{font:500 14px/20px var(--font);color:var(--ink)}
.req::after{content:" *";color:var(--bad)}
.hint{font-size:13px;line-height:20px;color:var(--ink-3);max-width:var(--measure)}
.cnt{font-size:12px;line-height:16px;color:var(--ink-3);justify-self:end}
.cnt.over{color:var(--warn)}
.jm{color:var(--bad);font-size:13px;line-height:20px}
/* escolhas: todas com a mesma forma e altura */
.opts,.radios,.conf,.temas{display:flex;flex-wrap:wrap;gap:var(--s2)}
.opts button,.radios button,.conf button,.temas button{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:var(--h-md);padding:0 18px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--pill);cursor:pointer;font:500 14px/20px var(--font);color:var(--ink-2)}
.temas button{min-height:var(--h-sm);padding:0 14px;font-size:13px}
.opts button{min-width:112px}
.opts button:hover,.radios button:hover,.conf button:hover,.temas button:hover{border-color:var(--accent);color:var(--accent)}
.radios button[aria-pressed="true"],.conf button[aria-pressed="true"],.temas button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opts button[aria-pressed="true"][data-v="sim"]{background:var(--good);border-color:var(--good);color:#fff}
.opts button[aria-pressed="true"][data-v="não"]{background:var(--bad);border-color:var(--bad);color:#fff}
.opts button[aria-pressed="true"][data-v="verificar"]{background:var(--yellow);border-color:var(--yellow-line);color:#3d3200}
.opts button[aria-pressed="true"][data-v="n/a"]{background:var(--ink-3);border-color:var(--ink-3);color:#fff}
.opts button:disabled,.radios button:disabled,.conf button:disabled,.temas button:disabled{cursor:default;opacity:.7}
@media (max-width:600px){ .opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))} .opts button{min-width:0;padding:0 8px} }
/* lista de projetos para marcar: grade alinhada, não nuvem */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--s2)}
.plist button{display:grid;grid-template-columns:44px minmax(0,1fr);gap:var(--s2);align-items:center;text-align:left;min-height:var(--h-md);padding:6px 12px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);cursor:pointer;font:400 13px/18px var(--font);color:var(--ink-2)}
.plist button b{font-weight:600;color:var(--ink-3)}
.plist button:hover{border-color:var(--accent)}
.plist button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.plist button[aria-pressed="true"] b{color:var(--accent)}

/* ---------- blocos ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.pad{padding:var(--pad)}
.note{max-width:80ch;border-radius:var(--r-sm);padding:var(--s3) var(--s4);font-size:14px;line-height:22px;background:var(--sunk);color:var(--ink-2)}
.note.info{background:var(--accent-soft);color:var(--ink)} .note.good{background:var(--good-soft);color:var(--ink)} .note.warn{background:var(--warn-soft);color:var(--ink)} .note.bad{background:var(--bad-soft);color:var(--ink)}
.note b{color:var(--ink);font-weight:600}
.banner{border-radius:var(--r-sm);padding:var(--s3) var(--s4);background:var(--warn-soft);font-size:14px}
.chip{display:inline-flex;align-items:center;min-height:24px;border-radius:var(--pill);padding:0 10px;font:500 12px/16px var(--font);background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.mt{display:inline-grid;place-items:center;min-width:32px;height:22px;border-radius:var(--r-xs);padding:0 6px;font:600 11px/1 var(--font);color:#fff;flex:none}
.mt.M1{background:var(--m1)} .mt.M2{background:var(--m2)} .mt.M3{background:var(--m3)} .mt.M4{background:var(--m4)} .mt.M5{background:var(--m5)} .mt.M6{background:var(--m6)} .mt.T{background:var(--mt)}
.sech{display:flex;align-items:center;gap:var(--s3)}
.sech::before{content:"";width:4px;height:20px;border-radius:2px;background:var(--accent);flex:none}
.dots{display:inline-flex;gap:4px} .dots i{width:8px;height:8px;border-radius:50%;background:var(--line-2)} .dots i.on{background:var(--accent)}
.prog{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden} .prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.empty{padding:var(--s6) var(--s5);color:var(--ink-3);font-size:14px}
.toast{position:fixed;bottom:calc(var(--s5) + env(safe-area-inset-bottom,0px));right:max(var(--s5),env(safe-area-inset-right,0px));background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:var(--pill);font:500 14px/20px var(--font);z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.ib{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--accent-line);background:var(--surface);color:var(--accent);font:600 13px/1 var(--font);cursor:pointer;display:grid;place-items:center;padding:0}
.ib[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.infobox{background:var(--accent-soft);border-radius:var(--r-sm);padding:var(--s3) var(--s4);font-size:14px;line-height:22px;color:var(--ink)}
ul.clean,ol.clean{margin:0;padding-left:20px;display:grid;gap:var(--s1)}
.vazio{color:var(--ink-3);font-style:italic;font-size:14px}

/* tabelas: sem moldura quando estão dentro de um cartão */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:20px}
th,td{padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
thead th{font:500 12px/16px var(--font);color:var(--ink-3);white-space:nowrap;background:var(--surface)}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
td.end,th.end{text-align:right;width:1%;white-space:nowrap}
tr.sub td{background:var(--sunk);font-weight:500;color:var(--ink)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}
.qcard .tw,.card .tw,.drawer .tw{border:0;border-radius:0;background:transparent;margin-inline:calc(-1*var(--pad));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.qcard .tw th:first-child,.qcard .tw td:first-child,.card .tw th:first-child,.card .tw td:first-child,.drawer .tw th:first-child,.drawer .tw td:first-child{padding-left:var(--pad)}
.qcard .tw th:last-child,.qcard .tw td:last-child,.card .tw th:last-child,.card .tw td:last-child,.drawer .tw th:last-child,.drawer .tw td:last-child{padding-right:var(--pad)}
@media (max-width:760px){ .tw:not(.stk) table{min-width:600px} }
@media (max-width:640px){
  .tw.stk table{min-width:0}
  .tw.stk thead{display:none}
  .tw.stk tbody,.tw.stk tr{display:block}
  .tw.stk tr{padding:var(--s3) var(--s4);border-bottom:1px solid var(--line)}
  .tw.stk tr:last-child{border-bottom:0}
  .tw.stk td{display:block;border:0;padding:2px 0!important;text-align:left!important;white-space:normal!important;width:auto}
  .tw.stk td:first-child{font-weight:500;color:var(--ink);margin-bottom:var(--s1)}
  .tw.stk td[data-label]:not(:first-child)::before{content:attr(data-label) ": ";font:500 12px/16px var(--font);color:var(--ink-3)}
  .tw.stk td:empty{display:none}
  .tw.stk tr.sub td{background:none}
  .tw.stk tr.sub{background:var(--sunk)}
}

/* ---------- início ---------- */
.hero{display:grid;gap:var(--s4);padding:var(--s5) 0 0}
.hx{display:grid;width:fit-content;max-width:100%;color:var(--accent)}
.hx .l1{font:300 clamp(28px,3.4vw,40px)/1.2 var(--font)}
.hx .l2{font:600 clamp(36px,5vw,60px)/1.05 var(--font);letter-spacing:-.015em;justify-self:end;padding-left:clamp(0px,7vw,128px)}
.hero p{max-width:60ch;font:300 17px/28px var(--font);color:var(--ink-2)}
.doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s5);margin-top:var(--s2)}
@media (max-width:820px){.doors{grid-template-columns:1fr}}
.door{all:unset;box-sizing:border-box;cursor:pointer;background:#183eff;color:#fff;border-radius:var(--r-lg);padding:var(--s6);display:grid;grid-template-columns:48px minmax(0,1fr);grid-template-rows:auto auto auto 1fr;column-gap:var(--s5);row-gap:var(--s2);min-height:232px;transition:background .15s}
.door:hover{background:#0f2fd6}
.door:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.door .dn{grid-row:1/5;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font:600 18px/1 var(--font)}
.door>*:not(.dn){grid-column:2}
.door h2{font:500 22px/30px var(--font);color:#fff}
.door p{font:300 15px/24px var(--font);color:rgba(255,255,255,.92);max-width:48ch}
.door .dq{font-size:13px;line-height:20px;color:rgba(255,255,255,.9)}
.door .dq::before{content:"Quem faz: "}
.door .st{align-self:end;margin-top:var(--s4);display:flex;flex-wrap:wrap;gap:var(--s2)}
.door .st span{background:var(--yellow);color:#183eff;font:600 13px/20px var(--font);padding:2px 10px;border-radius:var(--r-xs);white-space:nowrap}
@media (max-width:760px){ .door{padding:var(--s5);column-gap:var(--s4);min-height:0;grid-template-columns:40px minmax(0,1fr)} .door .dn{width:40px;height:40px;font-size:16px} }
.trail{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) 0;font-size:14px;line-height:20px;color:var(--ink-2);padding:var(--s2) 0}
.trail span{display:inline-flex;align-items:baseline;gap:6px}
.trail span+span::before{content:"";align-self:center;width:24px;height:1px;background:var(--line-2);margin:0 var(--s3)}
.trail b{font:600 18px/24px var(--font);color:var(--accent)}

/* ---------- listas ---------- */
.listbar{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center}
.listbar input{max-width:360px}
.fchips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.fchips button{min-height:var(--h-sm);border:1px solid var(--line-2);background:var(--surface);border-radius:var(--pill);padding:0 14px;font:500 13px/18px var(--font);cursor:pointer;color:var(--ink-2)}
.fchips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.row{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--s1) var(--s4);align-items:center;min-height:64px;padding:var(--s3) var(--s5);border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--accent-soft)} .row:hover .nm{color:var(--accent)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.row .nm{font:500 15px/22px var(--font);color:var(--ink)}
.row .sb{font-size:13px;line-height:20px;color:var(--ink-3)}
.row .rt{display:grid;grid-auto-flow:column;align-items:center;justify-content:end;gap:var(--s4)}
.row .rt .num{width:88px;text-align:right;font-size:13px;color:var(--ink-3)}
.row .rt .stc{width:120px;display:flex;justify-content:flex-end}
@media (max-width:600px){.row{grid-template-columns:auto minmax(0,1fr);padding:var(--s3) var(--s4)}.row .rt{grid-column:2;justify-content:start}.row .rt .num,.row .rt .stc{width:auto}}
.grp{display:grid;gap:var(--s3)}
.grph{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s3);font:500 18px/26px var(--font);margin-top:var(--s2)}
.grph i{width:10px;height:10px;border-radius:50%;flex:none}

function situacao(c){ const E=c.eleg||[];
  if([0,1,2,3,4,5].some(i=>!E[i])) return "A responder";
  if(E[0]==="não") return "Outro órgão"; if(E[4]==="não") return "Incorporar"; if(E[1]==="não"||E[2]==="não"||E[3]==="não") return "Reformular"; if(E[5]==="não") return "Concluir ou Reformular";
  if(!(+c.novos>0)) return "Segue sem recurso novo";
  return E.includes("verificar")?"Apta com pendências":"Apta"; }
const apta=c=>c.status!=="rascunho"&&situacao(c).startsWith("Apta");
const chipSit=s=>`<span class="chip ${s==="Apta"?"good":s==="Apta com pendências"?"acc":s==="A responder"?"warn":s==="Segue sem recurso novo"?"":"bad"}">${esc(s)}</span>`;
function explicaSit(c){ const s=situacao(c), E=c.eleg||[];
  const pend=ELQ.map((q,i)=>E[i]==="verificar"?q.t.toLowerCase():null).filter(Boolean), nao=ELQ.map((q,i)=>E[i]==="não"?{i,q}:null).filter(Boolean);
  if(s==="A responder") return {s,cls:"",t:`Faltam ${[0,1,2,3,4,5].filter(i=>!E[i]).length} respostas.`};
  if(nao.length) return {s,cls:"bad",t:`Não passa na porta. ${nao.map(x=>`Pergunta ${x.i+1}: ${x.q.no}`).join(" ")}`};
  if(s==="Segue sem recurso novo") return {s,cls:"",t:"Passa nas seis condições, mas não pede recurso novo para 2027. Segue com o orçamento já comprometido, não entra na disputa pelo teto e por isso não vai para a pontuação."};
  if(pend.length) return {s,cls:"warn",t:`Segue para as notas, com pendência a resolver antes da Diretoria Executiva: ${pend.join(", ")}.`};
  return {s,cls:"good",t:"Passa nas seis condições e segue para a atribuição de notas."}; }
function N1(c){ const g=(c.grades||[0,0,0,0,0,0]).map(Number), mx=Math.max(...g), n2=g.filter(x=>x>=2).length; return Math.min(5,1+mx+(n2>=2?1:0)); }
function avaliacoesDe(code,dados){
  return ["A1","A2","A3"].map(sl=>S.aval[code+"__"+sl]).filter(a=>a&&a.enviada); }
function consolidar(c,dados){ const av=avaliacoesDe(c.code,dados); if(!av.length) return null;
  const notas={}, amp={}; for(const k of AVC){ const v=av.map(a=>+a.notas[k]).filter(x=>!isNaN(x)); notas[k]=mediana(v); amp[k]=v.length?Math.max(...v)-Math.min(...v):0; }
  const risco=av.filter(a=>a.risco).length>=2, incerta=AVC.filter(k=>amp[k]>=1||av.some(a=>a.conf&&a.conf[k]==="Baixa"));
  return {n:av.length,av,notas,amp,exq:[0,1,2,3].map(i=>mediana(av.map(a=>+a.exq[i]))),conciliar:AVC.filter(k=>amp[k]>=2),risco,incerta}; }
function pesos(c,bm){ const m=misOf(c), e=EIX[c.eixo]||"G", B=W.blocos, w={};
  const add=(rel,b)=>{ const t=Object.values(rel).reduce((a,x)=>a+x,0); for(const k in rel) w[k]=B[b]/100*(bm?bm[b]:1)*rel[k]/t; };
  add(W.K,"K"); add(W.N[m],"N"); add(W.S[m],"S"); add(W.X[e],"X");
  if(bm){ const t=Object.values(w).reduce((a,x)=>a+x,0); for(const k in w) w[k]/=t; } return w; }
const blocoDe=k=>k==="N1"?"N":CR[k].b;
function valorar(c,notas,exq,risco,bm){
  const w=pesos(c,bm), nota=k=>k==="N1"?N1(c):notas[k]; const parc={}; let v=0; const porB={K:0,N:0,S:0,X:0};
  for(const k in w){ parc[k]=w[k]*nota(k)*20; v+=parc[k]; porB[blocoDe(k)]+=parc[k]; }
  const nuc=["K1","K2","K3"].map(k=>({k,v:nota(k)})); let nw=0,ns=0; for(const k of ["N1","N2","N3","N4","N5"]){ nw+=w[k]; ns+=w[k]*nota(k);} const mB=ns/nw;
  const checks=[
    {ok:nuc.every(x=>x.v>=REGRA.notaMin),t:"Nota mínima no núcleo comum",d:`Cada critério do núcleo precisa de pelo menos ${REGRA.notaMin}. Notas: ${nuc.map(x=>CR[x.k].n.toLowerCase()+" "+fmtN(x.v)).join("; ")}.`,mot:"nota mínima no núcleo"},
    {ok:mB>=REGRA.minBloco,t:"Média do bloco de missão",d:`A média ponderada do bloco de missão precisa ser pelo menos ${REGRA.minBloco}. Média: ${nf2.format(mB)}.`,mot:"bloco de missão"},
    {ok:N1(c)>=REGRA.travaMin,t:"Aderência à missão",d:`A aderência calculada a partir do Canvas precisa ser pelo menos ${REGRA.travaMin}. Aderência: ${N1(c)}.`,mot:"aderência à missão"},
    {ok:!risco,t:"Sem risco crítico sem mitigação",d:risco?"Duas ou mais leituras apontaram risco crítico sem plano de mitigação. Isso impede a priorização.":"Nenhuma maioria de leituras apontou risco crítico sem mitigação.",mot:"risco crítico sem mitigação"}];
  const med=exq.reduce((a,b)=>a+b,0)/4, f=Math.max(0.5,REGRA.piso+(1-REGRA.piso)*(med-1)/4);
  return {w,parc,porB,valor:v,fator:f,aj:v*f,medExq:med,checks,passa:checks.every(x=>x.ok),mot:checks.filter(x=>!x.ok).map(x=>x.mot)}; }
function esteira(){
  const L=enviados().map(c=>{ const sit=situacao(c), ok=apta(c), cons=ok?consolidar(c):null, completo=!!(cons&&cons.n===3), usa=cons&&(completo||LOC.parc==="todos"), v=usa?valorar(c,cons.notas,cons.exq,cons.risco):null;
    return {c,sit,ok,cons,completo,v,naFila:!!(v&&v.passa),razao:v&&v.passa?v.aj/(+c.novos/1e6):null}; });
  const fila=L.filter(l=>l.naFila).sort((a,b)=>b.razao-a.razao), teto=somaP()*LOC.teto/100; let acc=0, parou=false, res=0;
  fila.forEach((l,i)=>{ l.pos=i+1; if(!parou&&acc+(+l.c.novos)<=teto+1e-6){ acc+=+l.c.novos; l.cabe=true; l.acc=acc; } else { parou=true; l.cabe=false; l.reserva=++res; } });
  return {L,fila,teto,usado:acc}; }

const PDFCACHE={};
async function renderPDF(url,host,token){
  if(!window.pdfjsLib){ host.innerHTML=`<p class="empty">O leitor de PDF não carregou. Use o botão Baixar.</p>`; return; }
  try{ let doc=PDFCACHE[url]; if(!doc){ doc=await pdfjsLib.getDocument({url:await urlArq(url)}).promise; PDFCACHE[url]=doc; }
    if(host.dataset.token!==token) return; host.innerHTML="";

function dbNuvem(sb){
  const st={};
  const snap=c=>{ const docs=[...st[c].m.entries()].sort((a,b)=>a[0]<b[0]?-1:1).map(([id,d])=>({id,exists:true,data:()=>JSON.parse(JSON.stringify(d))})); return {docs,size:docs.length,empty:!docs.length}; };
  const emit=c=>{ if(st[c]) st[c].cbs.forEach(f=>{ try{ f(snap(c)); }catch(e){ console.error(e); } }); };
  async function carregar(c){ let rows=[],de=0; for(;;){ const {data,error}=await sb.from("docs").select("id,dados").eq("colecao",c).order("id").range(de,de+999); if(error) throw error; rows=rows.concat(data); if(data.length<1000) break; de+=1000; }
    st[c].m=new Map(rows.map(r=>[r.id,r.dados])); emit(c); }
  const ouvir=()=>sb.channel("docs-mudancas").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{ const r=(p.new&&p.new.colecao)?p.new:p.old; if(!r||!st[r.colecao]) return;
    if(p.eventType==="DELETE") st[r.colecao].m.delete(r.id); else st[r.colecao].m.set(r.id,r.dados); emit(r.colecao); }).subscribe(s=>{ if(s==="SUBSCRIBED") Object.keys(st).forEach(c=>carregar(c).catch(()=>{})); });
  // o canal precisa da credencial de quem entrou; sem ela, o banco não envia inclusões nem alterações
  Promise.resolve(sb.realtime&&sb.realtime.setAuth?sb.realtime.setAuth(SESSAO&&SESSAO.access_token):null).catch(()=>{}).then(ouvir);
  clearInterval(window.__poll); window.__poll=setInterval(()=>{ if(document.visibilityState==="visible"&&SESSAO) Object.keys(st).forEach(c=>carregar(c).catch(()=>{})); },60000);
  return {
    collection:c=>({onSnapshot:(f,err)=>{ if(!st[c]) st[c]={m:new Map(),cbs:[]}; st[c].cbs.push(f); carregar(c).catch(e=>err&&err(e)); return ()=>{ st[c].cbs=st[c].cbs.filter(x=>x!==f); }; }}),
    doc:p=>{ const i=p.indexOf("/"), c=p.slice(0,i), id=p.slice(i+1); return {
      set:async o=>{ const {error}=await sb.from("docs").upsert({colecao:c,id,dados:o,atualizado_em:new Date().toISOString()}); if(error) throw error; if(st[c]){ st[c].m.set(id,JSON.parse(JSON.stringify(o))); emit(c); } },
      delete:async()=>{ const {error}=await sb.from("docs").delete().eq("colecao",c).eq("id",id); if(error) throw error; if(st[c]){ st[c].m.delete(id); emit(c); } } }; } }; }

function fluxoHTML(comRef){
  const cel=(i,row,cls,html)=>`<div class="fx-c ${cls}" style="grid-column:${i+1};grid-row:${row};order:${i*10+row}">${html}</div>`;
  const fases=FASES.map(([a,b,t,sec])=>`<div class="fx-c fx-fase" style="grid-column:${a}/${b+1};grid-row:1;order:${(a-1)*10}"><b>${esc(t)}</b><span>Seção ${esc(sec)} da metodologia</span></div>`).join("");
  const corpo=ETAPAS.map((e,i)=>[
    cel(i,2,"fx-h",`<span class="fx-n" aria-hidden="true">${i+1}</span><div><h3>${esc(e.t)}</h3><span>${e.rota?"na esteira":"fora da esteira piloto"}</span></div>`),
    cel(i,3,"fx-o",`<h4>${esc(e.k)}</h4><p>${esc(e.o)}</p>`),
    cel(i,4,"fx-r",`<span class="fx-l">Responsável</span><p>${esc(e.r)}</p>`),
    comRef?cel(i,5,"fx-ref",`<span class="fx-l">Referências</span><p>${esc(e.ref)}</p>`):"",
    cel(i,6,e.x?"fx-x":"fx-x vazio",e.x?`<b>${esc(e.x[0])}</b><p>${esc(e.x[1])}</p>`:""),
    cel(i,7,"fx-a",e.rota?`<button class="btn sm" data-fxgo="${e.rota}">${esc(e.abrir)}</button>`:"")
  ].join("")).join("");
  return `<div class="fx" aria-label="Seis etapas da governança da seleção">${fases}${corpo}
    <div class="fx-c fx-loop" style="grid-column:1/-1;grid-row:8;order:999"><span aria-hidden="true">↺</span><p><b>Ciclo seguinte:</b> os projetos em andamento voltam à entrada com os dados de execução, e a validação revisa critérios, descrição dos níveis e pesos.</p></div></div>`; }
function abrirFluxo(){
  let d=$("fxDlg"); if(!d){ d=document.createElement("dialog"); d.id="fxDlg"; d.className="fx-dlg"; d.setAttribute("aria-labelledby","fxT"); document.body.appendChild(d); }
  const desenhar=()=>{ d.innerHTML=`<div class="fx-top"><div><h2 id="fxT">Governança da seleção da carteira</h2><p>Seis etapas, com responsáveis, exceções e a correspondência com a Metodologia de Gestão de Projetos, Programas e Portfólio da Agência (MGP³).</p></div>
     <div class="fx-tools"><label class="fx-chk"><input type="checkbox" id="fxRef" ${LOC.fxRef?"checked":""}> Mostrar referências</label><button class="btn sm" id="fxPr">Imprimir</button><button class="btn sm primary" id="fxX">Fechar</button></div></div>
     <div class="fx-scroll" tabindex="0">${fluxoHTML(!!LOC.fxRef)}</div>`;
    $("fxX").onclick=()=>d.close(); $("fxPr").onclick=()=>{ document.body.classList.add("imprime-fx"); window.print(); setTimeout(()=>document.body.classList.remove("imprime-fx"),500); };
    $("fxRef").onchange=e=>{ LOC.fxRef=e.target.checked; salvarLocal(); desenhar(); $("fxRef").focus(); };
    d.querySelectorAll("[data-fxgo]").forEach(b=>b.onclick=()=>{ d.close(); go(b.dataset.fxgo); }); };
  desenhar(); d.showModal(); $("fxX").focus();
  d.onclick=e=>{ if(e.target===d) d.close(); }; }

const iniciais=n=>String(n||"").trim().split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join("")||"?";
const slugN=n=>String(n||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function equipe(){ const o={}; EQUIPE0.forEach(p=>o[p.id]=p); Object.values(S.equipe||{}).forEach(p=>{ if(!p.removido) o[p.id]={...(o[p.id]||{}),...p}; else delete o[p.id]; }); return Object.values(o).sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR")); }
function reconhecer(){ if(LOC.usuario||!S.uid) return; const m=equipe().filter(p=>(p.uids||[]).includes(S.uid)); if(m.length===1){ LOC.usuario={id:m[0].id,nome:m[0].nome}; salvarLocal(); } }
async function entrar(p){ LOC.usuario={id:p.id,nome:p.nome}; salvarLocal();
  if(S.dbOn&&S.podeEscrever!==false&&S.uid&&!(p.uids||[]).includes(S.uid)){ try{ await DB.doc("equipe/"+p.id).set({nome:p.nome,time:p.time||"",uids:[...(p.uids||[]),S.uid],ts:new Date().toISOString()}); }catch(e){} }
  toast("Você entrou como "+p.nome); render(); window.scrollTo(0,0); focoTitulo(); }

   <section class="ent" aria-label="Equipe">
    <ul class="ent-l" role="list">${eq.map(p=>`<li><button class="ent-p" data-ent="${esc(p.id)}"><i aria-hidden="true">${esc(iniciais(p.nome))}</i><span><b>${esc(p.nome)}</b><small>${esc(p.time||"Equipe")}</small></span><em aria-hidden="true">Entrar</em></button></li>`).join("")}</ul>
    <details class="ent-add"${eq.length?"":" open"}><summary>Adicionar pessoa à equipe</summary>
     <form id="entF" class="ent-f" novalidate>
      <div class="fld"><label for="entN" class="req">Nome</label><input type="text" id="entN" autocomplete="name" maxlength="60"></div>
      <div class="fld"><label for="entT">Equipe</label><select id="entT"><option>Produtos 2 e 3</option><option>Produto 2</option><option>Produto 3</option><option>Agência Brasileira de Desenvolvimento Industrial</option></select></div>
      <button class="btn primary" type="submit">Adicionar e entrar</button>
      <p class="jm" id="entE" hidden>Escreva o nome.</p>
     </form></details>
    <p class="small muted ent-nota">A escolha do nome não é senha. Quem pode abrir a esteira é definido no compartilhamento da página no claude.ai.</p>
   </section>`;
  M.querySelectorAll("[data-ent]").forEach(b=>b.onclick=()=>entrar(eq.find(p=>p.id===b.dataset.ent)));
  $("entF").onsubmit=async e=>{ e.preventDefault(); const n=$("entN").value.trim().replace(/\s+/g," "); if(n.length<2){ $("entE").hidden=false; $("entN").focus(); return; }
    const id=slugN(n), p={id,nome:n,time:$("entT").value};

    entrar(p); }; }

function lista(mod,itens,linha,filtros,vazio){
  const q=(LOC.q[mod]||"").trim().toLowerCase(), f=LOC.lf[mod]||"";
  const fil=itens.filter(c=>(!q||(c.code+" "+c.nome).toLowerCase().includes(q))&&(!f||filtros.fn(c)===f));
  const cont={}; itens.forEach(c=>{ const k=filtros.fn(c); cont[k]=(cont[k]||0)+1; });
  return `<div class="listbar"><input type="search" data-q="${mod}" placeholder="Buscar por código ou nome" value="${esc(LOC.q[mod]||"")}" aria-label="Buscar projeto">
    <div class="fchips"><button data-lf="${mod}" data-v="" aria-pressed="${!f}">Todos ${itens.length}</button>${filtros.ordem.filter(k=>cont[k]).map(k=>`<button data-lf="${mod}" data-v="${esc(k)}" aria-pressed="${f===k}">${esc(k)} ${cont[k]}</button>`).join("")}</div></div>
   <div class="rows">${fil.map(c=>{ const r=linha(c); return `<button class="row" data-open="${mod}/${esc(c.code)}">${mt(misOf(c))}<span><span class="nm">${esc(c.nome||"Sem nome")}</span><br><span class="sb">${esc(c.code)} · ${esc(c.dir||"")}${c.unidade?" · "+esc(c.unidade):""}</span></span><span class="rt">${r}</span></button>`; }).join("")||`<p class="empty">${vazio}</p>`}</div>`; }
function ligarLista(M){
  M.querySelectorAll("[data-q]").forEach(q=>q.oninput=()=>{ LOC.q[q.dataset.q]=q.value; clearTimeout(q._t); q._t=setTimeout(()=>{ const pos=q.selectionStart; render(); const n=document.querySelector(`[data-q="${q.dataset.q}"]`); if(n){ n.focus(); n.setSelectionRange(pos,pos);} },200); });
  M.querySelectorAll("[data-lf]").forEach(b=>b.onclick=()=>{ LOC.lf[b.dataset.lf]=b.dataset.v; render(); });
  M.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>go(b.dataset.open)); }
const crumb=(itens)=>`<nav class="crumb" aria-label="Você está em">${itens.map(([t,h],i)=>h?`<a href="#${h}">${t}</a>`:`<span>${t}</span>`).join('<span class="sep">›</span>')}</nav>`;
const phead=(crumbs,t,lead,meta,aside)=>`<header class="ph">${crumb(crumbs)}<div class="ph-row"><h1>${t}</h1>${aside?`<div class="ph-aside">${aside}</div>`:""}</div>${lead?`<p class="ph-lead">${lead}</p>`:""}${meta?`<dl class="ph-meta">${meta.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>`:""}</header>`;
const headM=(t,d,quem,quando,acao)=>phead([["Início","inicio"],[t]],t,d,[["Quem faz",quem],["Quando",quando]],acao);
